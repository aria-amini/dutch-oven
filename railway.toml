[build]
builder = "RAILPACK"
buildCommand = "vp run build && pnpm exec varlock freeze"

[deploy]
preDeployCommand = "pnpm exec varlock run --frozen -- tsx mise-tasks/migrate.ts"
runtime = "V2"
numReplicas = 1
startCommand = "pnpm exec varlock run --frozen -- node --import ./.output/server/instrument.server.mjs .output/server/index.mjs"
healthcheckPath = "/"
useLegacyStacker = false
restartPolicyType = "ALWAYS"
healthcheckTimeout = 300
